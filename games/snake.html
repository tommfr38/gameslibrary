<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snake – games library</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<div class="topbar"><a href="../index.html">← Library</a><h1>Snake</h1></div>
<main class="game">
  <div class="hud">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
  </div>
  <canvas id="c" width="480" height="480"></canvas>
  <div class="row">
    <button class="btn" id="start">New game</button>
    <button class="btn secondary" id="pause">Pause</button>
  </div>
  <p class="help">Arrow keys or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to steer, <kbd>Space</kbd> to pause. On touch screens, swipe on the board.</p>
</main>

<script src="../shared.js"></script>
<script>
const N = 20, S = 24;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

let snake, dir, queue, food, score, best, state, timer;
// state: 'ready' | 'running' | 'paused' | 'over'

best = Scores.get('snake') || 0;
$('best').textContent = best;

function reset() {
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  queue = [];
  score = 0;
  state = 'ready';
  clearTimeout(timer);
  placeFood();
  $('score').textContent = 0;
  draw();
}

function placeFood() {
  const free = [];
  for (let x = 0; x < N; x++)
    for (let y = 0; y < N; y++)
      if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}

const delay = () => Math.max(55, 140 - Math.floor(score / 5) * 6);

function tick() {
  if (state !== 'running') return;
  if (queue.length) dir = queue.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const eating = food && head.x === food.x && head.y === food.y;
  // The tail moves away this tick unless we're growing, so it isn't a collision.
  const body = eating ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || body.some(s => s.x === head.x && s.y === head.y)) {
    state = 'over';
    best = Scores.submit('snake', score);
    $('best').textContent = best;
    draw();
    return;
  }
  snake.unshift(head);
  if (eating) {
    score++;
    $('score').textContent = score;
    placeFood();
    if (!food) { state = 'over'; best = Scores.submit('snake', score); $('best').textContent = best; }
  } else {
    snake.pop();
  }
  draw();
  if (state === 'running') timer = setTimeout(tick, delay());
}

function steer(nx, ny) {
  // Any direction key starts the game, including the one the snake already faces.
  if (state === 'ready') { state = 'running'; timer = setTimeout(tick, delay()); }
  const ref = queue.length ? queue[queue.length - 1] : dir;
  if (nx === -ref.x && ny === -ref.y) return;   // no reversing
  if (nx === ref.x && ny === ref.y) return;
  if (queue.length < 3) queue.push({ x: nx, y: ny });
}

function togglePause() {
  if (state === 'running') { state = 'paused'; clearTimeout(timer); draw(); }
  else if (state === 'paused') { state = 'running'; timer = setTimeout(tick, delay()); draw(); }
}

function draw() {
  ctx.fillStyle = '#0a0d1a';
  ctx.fillRect(0, 0, N * S, N * S);
  ctx.fillStyle = '#10142a';
  for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if ((x + y) % 2) ctx.fillRect(x * S, y * S, S, S);

  if (food) {
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(food.x * S + S / 2, food.y * S + S / 2, S / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
  }
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#86efac' : '#4ade80';
    ctx.beginPath();
    ctx.roundRect(s.x * S + 1, s.y * S + 1, S - 2, S - 2, 6);
    ctx.fill();
  });
  // eyes
  const h = snake[0];
  ctx.fillStyle = '#0a0d1a';
  const ex = dir.x * 4, ey = dir.y * 4;
  const px = -dir.y * 5, py = dir.x * 5;
  [-1, 1].forEach(k => {
    ctx.beginPath();
    ctx.arc(h.x * S + S / 2 + ex + px * k, h.y * S + S / 2 + ey + py * k, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });

  const text = { ready: ['Press an arrow key', 'to start'], paused: ['PAUSED', 'Space to resume'], over: ['GAME OVER', 'Score ' + score] }[state];
  if (text) {
    ctx.fillStyle = 'rgba(10,13,26,.7)';
    ctx.fillRect(0, 0, N * S, N * S);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8ebff';
    ctx.font = 'bold 30px system-ui';
    ctx.fillText(text[0].toLowerCase(), N * S / 2, N * S / 2 - 6);
    ctx.font = '16px system-ui';
    ctx.fillStyle = '#8d94c2';
    ctx.fillText(text[1].toLowerCase(), N * S / 2, N * S / 2 + 22);
  }
}

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const dirs = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] };
  if (dirs[k]) {
    e.preventDefault();
    if (state === 'over') return;
    if (state === 'paused') togglePause();
    steer(...dirs[k]);
  } else if (k === ' ') { e.preventDefault(); togglePause(); }
  else if (k === 'enter' && state === 'over') reset();
});

let tx, ty;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
cv.addEventListener('touchend', e => {
  if (state === 'over') { reset(); return; }
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) steer(Math.sign(dx), 0); else steer(0, Math.sign(dy));
});

$('start').onclick = e => { e.target.blur(); reset(); };
$('pause').onclick = e => { e.target.blur(); togglePause(); };
reset();
</script>
</body>
</html>
