<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>breakout – games library</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<div class="topbar"><a href="../index.html">← Library</a><h1>Breakout</h1></div>
<main class="game">
  <div class="hud">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Lives</small><b id="lives">3</b></div>
    <div class="stat"><small>Level</small><b id="level">1</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
  </div>
  <canvas id="c" width="480" height="560"></canvas>
  <button class="btn" id="start">New game</button>
  <p class="help">Move the paddle with the mouse, finger, or <kbd>←</kbd>/<kbd>→</kbd>. <kbd>Space</kbd> or click launches the ball. Hit the ball with the edge of the paddle to steer it.</p>
</main>

<script src="../shared.js"></script>
<script>
const W = 480, H = 560;
const COLS = 10, ROWS = 6, BW = 42, BH = 18, GAP = 4, TOP = 60;
const LEFT = (W - (COLS * BW + (COLS - 1) * GAP)) / 2;
const PH = 12, PY = H - 34, R = 7;
const ROW_COLORS = ['#f87171', '#fb923c', '#fbbf24', '#4ade80', '#22d3ee', '#a78bfa'];
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

let paddle, ball, bricks, score, lives, level, best, state, keys = {}, last;
// state: 'ready' (ball on paddle) | 'play' | 'paused' | 'over'

best = Scores.get('breakout') || 0;
$('best').textContent = best;

const ballSpeed = () => 5 + (level - 1) * 0.6;

function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: LEFT + c * (BW + GAP), y: TOP + r * (BH + GAP), color: ROW_COLORS[r], points: (ROWS - r) * 10, alive: true });
}

function resetBall() {
  ball = { x: paddle.x + paddle.w / 2, y: PY - R - 1, vx: 0, vy: 0 };
  state = 'ready';
}

function newGame() {
  paddle = { x: W / 2 - 40, w: 80 };
  score = 0; lives = 3; level = 1;
  buildBricks();
  resetBall();
  hud();
}

function hud() {
  $('score').textContent = score;
  $('lives').textContent = lives;
  $('level').textContent = level;
  $('best').textContent = best;
}

function launch() {
  const a = (Math.random() * 0.6 - 0.3);
  const s = ballSpeed();
  ball.vx = Math.sin(a) * s;
  ball.vy = -Math.cos(a) * s;
  state = 'play';
}

function update(k) {
  const step = 7 * k;
  if (keys.left) paddle.x -= step;
  if (keys.right) paddle.x += step;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

  if (state === 'ready') { ball.x = paddle.x + paddle.w / 2; return; }
  if (state !== 'play') return;

  ball.x += ball.vx * k;
  ball.y += ball.vy * k;

  if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); }
  if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y < R) { ball.y = R; ball.vy = Math.abs(ball.vy); }

  // paddle
  if (ball.vy > 0 && ball.y + R >= PY && ball.y + R <= PY + PH + ball.vy * k + 2 &&
      ball.x >= paddle.x - R && ball.x <= paddle.x + paddle.w + R) {
    const rel = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
    const a = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3);
    const s = ballSpeed();
    ball.vx = Math.sin(a) * s;
    ball.vy = -Math.cos(a) * s;
    ball.y = PY - R;
  }

  // bricks - resolve at most one per frame
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + R > b.x && ball.x - R < b.x + BW && ball.y + R > b.y && ball.y - R < b.y + BH) {
      b.alive = false;
      score += b.points * level;
      const ox = Math.min(ball.x + R - b.x, b.x + BW - (ball.x - R));
      const oy = Math.min(ball.y + R - b.y, b.y + BH - (ball.y - R));
      if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
      best = Scores.submit('breakout', score);
      hud();
      break;
    }
  }

  if (bricks.every(b => !b.alive)) {
    level++;
    buildBricks();
    resetBall();
    hud();
    return;
  }

  if (ball.y > H + R) {
    lives--;
    hud();
    if (lives <= 0) { state = 'over'; best = Scores.submit('breakout', score); hud(); }
    else resetBall();
  }
}

function center(t, y, size, color) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px system-ui`;
  ctx.textAlign = 'center';
  ctx.fillText(t.toLowerCase(), W / 2, y);
}

function draw() {
  ctx.fillStyle = '#0a0d1a';
  ctx.fillRect(0, 0, W, H);
  bricks.forEach(b => {
    if (!b.alive) return;
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.roundRect(b.x, b.y, BW, BH, 4);
    ctx.fill();
  });
  ctx.fillStyle = '#6c8cff';
  ctx.beginPath();
  ctx.roundRect(paddle.x, PY, paddle.w, PH, 6);
  ctx.fill();
  ctx.fillStyle = '#e8ebff';
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
  ctx.fill();

  if (state === 'ready') center('Space or click to launch', H / 2 + 60, 18, '#8d94c2');
  if (state === 'paused') { ctx.fillStyle = 'rgba(10,13,26,.7)'; ctx.fillRect(0, 0, W, H); center('PAUSED', H / 2, 34, '#e8ebff'); }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(10,13,26,.75)';
    ctx.fillRect(0, 0, W, H);
    center('GAME OVER', H / 2 - 6, 36, '#e8ebff');
    center('Score ' + score + ' · click to play again', H / 2 + 24, 16, '#8d94c2');
  }
}

function loop(t) {
  const k = last ? Math.min((t - last) / 16.667, 3) : 1;
  last = t;
  update(k);
  draw();
  requestAnimationFrame(loop);
}

function primary() {
  if (state === 'ready') launch();
  else if (state === 'over') newGame();
  else if (state === 'play') state = 'paused';
  else if (state === 'paused') state = 'play';
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
  else if (e.key === ' ') { e.preventDefault(); if (!e.repeat) primary(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});

function pointerX(clientX) {
  const r = cv.getBoundingClientRect();
  paddle.x = Math.max(0, Math.min(W - paddle.w, (clientX - r.left) * (W / r.width) - paddle.w / 2));
}
cv.addEventListener('mousemove', e => pointerX(e.clientX));
cv.addEventListener('touchmove', e => pointerX(e.touches[0].clientX), { passive: true });
cv.addEventListener('touchstart', e => pointerX(e.touches[0].clientX), { passive: true });
cv.addEventListener('click', primary);
$('start').onclick = e => { e.target.blur(); newGame(); };

newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
